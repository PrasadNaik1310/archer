services:
  - type: web
    name: archer-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8080"
      - key: EMBEDDING_INTERNAL_PORT
        value: "8000"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: EMBEDDING_SERVICE_URL
        value: "http://127.0.0.1:8000"
      - key: MONGO_URI
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_HOST
        sync: false
