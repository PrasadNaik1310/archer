services:
  - type: web
    name: archer-embedding-service
    runtime: docker
    dockerContext: ./backend/embedding-service
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"

  - type: web
    name: archer-go-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: EMBEDDING_SERVICE_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_HOST
        sync: false
